server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: heatwave-advisory-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/heatwave_advisory_db}
      auto-index-creation: true
  jackson:
    time-zone: Asia/Kolkata
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
heatwave:
  seed:
    enabled: ${SEED_DATA_ENABLED:true}
  model:
    version: CES-HW-RULES-v1.0
    terrain-thresholds:
      PLAINS: 40.0
      COASTAL: 37.0
      HILLY: 30.0
    severe-absolute-temperature: 45.0
    severe-above-terrain: 6.0
    severe-heat-index: 50.0
    warning-departure: 4.5
    warning-heat-index: 44.0
    watch-near-threshold: 2.0
    watch-departure-min: 2.5
    watch-departure-max: 4.4
    watch-heat-index-min: 38.0
    watch-heat-index-max: 43.9


# Keep secret values outside source control. JWT_SECRET must be at least 32 bytes.
app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    bootstrap-admin:
      username: ${APP_ADMIN_USERNAME:}
      password: ${APP_ADMIN_PASSWORD:}
